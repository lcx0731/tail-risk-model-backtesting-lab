[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tail-risk-model-backtesting-lab"
version = "0.1.0"
description = "Out-of-sample VaR and expected-shortfall audit for Gaussian, historical, and EVT models"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Chenxin Lyu"}]
dependencies = [
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scipy>=1.11,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
tail-risk-lab = "tail_risk_model_backtesting_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
